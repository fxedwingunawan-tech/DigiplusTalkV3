function resizeImageFile(file, maxDim = 1440, quality = 0.82) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("Gagal membaca file"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("Gagal memuat gambar"));
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          if (width > height) {
            height = Math.round(height * (maxDim / width));
            width = maxDim;
          } else {
            width = Math.round(width * (maxDim / height));
            height = maxDim;
          }
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function parseBulkPointsText(text) {
  return text
    .split("\n")
    .map((line) => line.trim())
    .filter(Boolean)
    .map((line) => {
      const parts = line.split("|").map((s) => s.trim());
      const catRaw = parts[0] || "";
      const point = parts[1] || (parts.length === 1 ? "" : "");
      const talk = parts[2] || "";
      const category = CATEGORIES.includes(catRaw) ? catRaw : "Lainnya";
      return { category, point, talk: talk || point };
    })
    .filter((p) => p.point);
}

                      className="w-full rounded-2xl p-3.5 flex items-center gap-3 text-left hover:shadow-md hover:-translate-y-0.5 transition-all"
                    >
                      {m.images && m.images.length > 0 ? (
                        <img src={m.images[0].dataUrl} alt={m.name} className="w-11 h-11 rounded-xl object-cover shrink-0" />
                      ) : (
                        <div
                          style={{ background: COLORS.surfaceAlt, color: COLORS.textMuted }}
                          className="w-11 h-11 rounded-xl flex items-center justify-center shrink-0"
                        >
                          <Smartphone size={18} />
                        </div>
                      )}
                      <div className="flex-1 min-w-0">
                        <div className="font-medium text-sm truncate">{m.name}</div>
                        <div style={{ color: COLORS.textMuted }} className="text-xs">
                          {data.points.filter((p) => p.modelId === m.id).length} selling point
                          {m.images && m.images.length > 0 ? ` · ${m.images.length} foto` : ""}
                        </div>
                      </div>
                      {isAdmin && (
                        <div className="flex gap-1 shrink-0" onClick={(e) => e.stopPropagation()}>
                          <span
                            role="button"
                            onClick={() => {
                              setEditingModelId(m.id);
                              setEditModelName(m.name);
                            }}
                            style={{ color: COLORS.textMuted }}
                            className="p-1.5"
                          >
                            <Pencil size={14} />
                          </span>
                          <span role="button" onClick={() => deleteModel(m.id)} style={{ color: COLORS.danger }} className="p-1.5">
                            <Trash2 size={14} />
                          </span>
                        </div>
                      )}
                    </button>
                  )}
                </div>
              ))}
              {modelsOfBrand.length === 0 && !addingModel && (
                <div style={{ color: COLORS.textMuted }} className="text-sm text-center py-10">
                  Belum ada tipe HP untuk brand ini.
                </div>
              )}
              {isAdmin && !addingModel && (
                <button
                  onClick={() => setAddingModel(true)}
                  style={{ border: `1px dashed ${COLORS.borderStrong}`, color: COLORS.textMuted }}
                  className="rounded-2xl p-3.5 flex items-center justify-center gap-2 text-sm hover:bg-black/5 transition-colors"
                >
                  <Plus size={16} /> Tambah tipe HP
                </button>
              )}
              {isAdmin && addingModel && (
                <div
                  style={{ background: COLORS.surface, border: `1px solid ${COLORS.border}` }}
                  className="rounded-2xl p-3 flex gap-2 shadow-sm"
                >
                  <input
                    autoFocus
                    value={newModelName}
                    onChange={(e) => setNewModelName(e.target.value)}
                    placeholder="Nama tipe HP baru"
                    style={inputStyle}
                    className="flex-1 px-3 py-2 rounded-lg text-sm outline-none"
                  />
                  <button onClick={saveNewModel} style={{ color: COLORS.redSoft }}>
                    <Check size={18} />
                  </button>
                  <button onClick={() => setAddingModel(false)} style={{ color: COLORS.textMuted }}>
                    <X size={18} />
                  </button>
                </div>
              )}
            </div>
          )}

          {view === "model" && (
            <div className="flex flex-col gap-5">
              <div
                style={{ background: COLORS.surface, border: `1px solid ${COLORS.border}` }}
                className="rounded-2xl p-3.5 shadow-sm"
              >
                <div className="flex items-center justify-between mb-2.5">
                  <div className="flex items-center gap-1.5 text-sm font-medium">
                    <Camera size={15} style={{ color: COLORS.red }} />
                    Foto Spesifikasi
                  </div>
                  {isAdmin && (
                    <button
                      onClick={() => fileInputRef.current && fileInputRef.current.click()}
                      disabled={uploadingImages}
                      style={{ color: COLORS.red }}
                      className="text-xs font-medium flex items-center gap-1 disabled:opacity-50"
                    >
                      <UploadCloud size={13} /> {uploadingImages ? "Mengunggah..." : "Upload foto"}
                    </button>
                  )}
                  <input
                    ref={fileInputRef}
                    type="file"
                    accept="image/*"
                    multiple
                    className="hidden"
                    onChange={(e) => {
                      handleImageUpload(e.target.files);
                      e.target.value = "";
                    }}
                  />
                </div>
                {modelImages.length === 0 ? (
                  <div style={{ color: COLORS.textMuted }} className="text-xs text-center py-6">
                    Belum ada foto spesifikasi untuk tipe ini.
                    {isAdmin && " Ketuk \"Upload foto\" untuk menambahkan."}
                  </div>
                ) : (
                  <div className="grid grid-cols-3 gap-2">
                    {modelImages.map((img, idx) => (
                      <div key={img.id} className="relative aspect-square">
                        <button
                          onClick={() => setLightboxIndex(idx)}
                          className="w-full h-full rounded-lg overflow-hidden block"
                          style={{ border: `1px solid ${COLORS.border}` }}
                        >
                          <img src={img.dataUrl} alt={`Spesifikasi ${idx + 1}`} className="w-full h-full object-cover" />
                        </button>
                        {isAdmin && (
                          <button
                            onClick={(e) => {
                              e.stopPropagation();
                              deleteImage(img.id);
                            }}
                            style={{ background: "rgba(17,17,17,0.65)", color: "#FFFFFF" }}
                            className="absolute top-1 right-1 p-1 rounded-full"
                          >
                            <Trash2 size={11} />
                          </button>
                        )}
                      </div>
                    ))}
                  </div>
                )}
              </div>

              {isAdmin && (
                <button
                  onClick={() => setShowBulkModal(true)}
                  style={{ border: `1px dashed ${COLORS.borderStrong}`, color: COLORS.textMuted }}
                  className="rounded-2xl p-3 flex items-center justify-center gap-2 text-xs hover:bg-black/5 transition-colors"
                >
                  <ListPlus size={15} /> Bulk update selling point
                </button>
              )}

              <div className="flex flex-col gap-2.5">
                {visiblePoints.map((p) => (
                  <div
                    key={p.id}
                    style={{ background: COLORS.surface, border: `1px solid ${COLORS.border}`, boxShadow: "0 1px 6px rgba(17,17,17,0.04)" }}
                    className="rounded-2xl overflow-hidden"
                  >
                    {editingPointId === p.id ? (
                      <div className="p-3 flex flex-col gap-2">
                        <select
                          value={editPointForm.category}
                          onChange={(e) => setEditPointForm({ ...editPointForm, category: e.target.value })}
                          style={inputStyle}
                          className="px-2 py-1.5 rounded-md text-sm outline-none"
                        >
                          {CATEGORIES.map((c) => (
                            <option key={c} value={c}>{c}</option>
                          ))}
                        </select>
                        <textarea
                          value={editPointForm.point}
                          onChange={(e) => setEditPointForm({ ...editPointForm, point: e.target.value })}
                          placeholder="Selling point"
                          style={inputStyle}
                          className="px-2 py-1.5 rounded-md text-sm outline-none resize-none"
                          rows={2}
                        />
                        <textarea
                          value={editPointForm.talk}
                          onChange={(e) => setEditPointForm({ ...editPointForm, talk: e.target.value })}
                          placeholder="Sales talk"
                          style={inputStyle}
                          className="px-2 py-1.5 rounded-md text-sm outline-none resize-none"
                          rows={2}
                        />
                        <div className="flex gap-3 justify-end">
                          <button onClick={() => setEditingPointId(null)} style={{ color: COLORS.textMuted }} className="text-xs flex items-center gap-1">
                            <X size={14} /> Batal
                          </button>
                          <button onClick={() => saveEditPoint(p.id)} style={{ color: COLORS.redSoft }} className="text-xs flex items-center gap-1">
                            <Check size={14} /> Simpan
                          </button>
                        </div>
                      </div>
                    ) : (
                      <React.Fragment>
                        <button
                          onClick={() => setExpanded(expanded === p.id ? null : p.id)}
                          className="w-full text-left p-3.5 flex items-start gap-2"
                        >
                          <div className="flex-1 min-w-0">
                            <div style={{ color: COLORS.red }} className="text-xs font-medium mb-1">{p.category}</div>
                            <div className="text-sm font-medium">{p.point}</div>
                          </div>
                          {expanded === p.id ? (
                            <ChevronUp size={16} style={{ color: COLORS.textMuted }} className="mt-1 shrink-0" />
                          ) : (
                            <ChevronDown size={16} style={{ color: COLORS.textMuted }} className="mt-1 shrink-0" />
                          )}
                        </button>
                        {expanded === p.id && (
                          <div style={{ borderTop: `1px solid ${COLORS.border}` }} className="px-3.5 py-3">
                            <div style={{ color: COLORS.textMuted }} className="text-xs mb-1">Sales talk</div>
                            <div style={{ color: COLORS.redSoft }} className="text-sm leading-relaxed">"{p.talk}"</div>
                            {isAdmin && (
                              <div className="flex gap-3 mt-3">
                                <button
                                  onClick={() => {
                                    setEditingPointId(p.id);
                                    setEditPointForm({ category: p.category, point: p.point, talk: p.talk });
                                  }}
                                  style={{ color: COLORS.textMuted }}
                                  className="text-xs flex items-center gap-1"
                                >
                                  <Pencil size={12} /> Ubah
                                </button>
                                <button onClick={() => deletePoint(p.id)} style={{ color: COLORS.danger }} className="text-xs flex items-center gap-1">
                                  <Trash2 size={12} /> Hapus
                                </button>
                              </div>
                            )}
                          </div>
                        )}
                      </React.Fragment>
                    )}
                  </div>
                ))}
                {visiblePoints.length === 0 && !addingPoint && (
                  <div style={{ color: COLORS.textMuted }} className="text-sm text-center py-10">
                    Belum ada selling point untuk tipe ini.
                  </div>
                )}
                {isAdmin && !addingPoint && (
                  <button
                    onClick={() => setAddingPoint(true)}
                    style={{ border: `1px dashed ${COLORS.borderStrong}`, color: COLORS.textMuted }}
                    className="rounded-2xl p-3.5 flex items-center justify-center gap-2 text-sm hover:bg-black/5 transition-colors"
                  >
                    <Plus size={16} /> Tambah selling point
                  </button>
                )}
                {isAdmin && addingPoint && (
                  <div
                    style={{ background: COLORS.surface, border: `1px solid ${COLORS.border}` }}
                    className="rounded-2xl p-3 flex flex-col gap-2 shadow-sm"
                  >
                    <select
                      value={pointForm.category}
                      onChange={(e) => setPointForm({ ...pointForm, category: e.target.value })}
                      style={inputStyle}
                      className="px-2 py-1.5 rounded-md text-sm outline-none"
                    >
                      {CATEGORIES.map((c) => (
                        <option key={c} value={c}>{c}</option>
                      ))}
                    </select>
                    <textarea
                      value={pointForm.point}
                      onChange={(e) => setPointForm({ ...pointForm, point: e.target.value })}
                      placeholder="Selling point, misal: Baterai 5000mAh"
                      style={inputStyle}
                      className="px-2 py-1.5 rounded-md text-sm outline-none resize-none"
                      rows={2}
                    />
                    <textarea
                      value={pointForm.talk}
                      onChange={(e) => setPointForm({ ...pointForm, talk: e.target.value })}
                      placeholder="Sales talk simple untuk customer"
                      style={inputStyle}
                      className="px-2 py-1.5 rounded-md text-sm outline-none resize-none"
                      rows={2}
                    />
                    <div className="flex gap-3 justify-end">
                      <button onClick={() => setAddingPoint(false)} style={{ color: COLORS.textMuted }} className="text-xs flex items-center gap-1">
                        <X size={14} /> Batal
                      </button>
                      <button onClick={saveNewPoint} style={{ color: COLORS.redSoft }} className="text-xs flex items-center gap-1">
                        <Check size={14} /> Simpan
                      </button>
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}
        </div>

        {showPin && (
          <div
            style={{ background: "rgba(0,0,0,0.6)" }}
            className="fixed inset-0 flex items-center justify-center z-50 px-6"
            onClick={() => setShowPin(false)}
          >
            <div
              onClick={(e) => e.stopPropagation()}
              style={{ background: COLORS.surface, border: `1px solid ${COLORS.border}` }}
              className="rounded-2xl p-5 w-full max-w-[300px] font-sans shadow-xl"
            >
              <div className="font-display font-semibold text-base mb-1" style={{ color: COLORS.text }}>
                Masuk mode admin
              </div>
              <div style={{ color: COLORS.textMuted }} className="text-xs mb-3">
                Masukkan PIN admin toko.
              </div>
              <input
                autoFocus
                type="password"
                inputMode="numeric"
                value={pin}
                onChange={(e) => {
                  setPin(e.target.value);
                  setPinError("");
                }}
                onKeyDown={(e) => e.key === "Enter" && submitPin()}
                style={inputStyle}
                className="w-full px-3 py-2 rounded-lg text-sm outline-none mb-2"
                placeholder="PIN"
              />
              {pinError && <div style={{ color: COLORS.danger }} className="text-xs mb-2">{pinError}</div>}
              <div className="flex gap-2 justify-end">
                <button onClick={() => setShowPin(false)} style={{ color: COLORS.textMuted }} className="text-sm px-3 py-1.5">
                  Batal
                </button>
                <button
                  onClick={submitPin}
                  style={{ background: `linear-gradient(135deg, ${COLORS.red}, ${COLORS.redSoft})`, color: "#FFFFFF" }}
                  className="text-sm px-4 py-1.5 rounded-lg font-medium shadow-sm"
                >
                  Masuk
                </button>
              </div>
            </div>
          </div>
        )}

        {showBulkModal && (
          <div
            style={{ background: "rgba(0,0,0,0.6)" }}
            className="fixed inset-0 flex items-center justify-center z-50 px-5"
            onClick={() => setShowBulkModal(false)}
          >
            <div
              onClick={(e) => e.stopPropagation()}
              style={{ background: COLORS.surface, border: `1px solid ${COLORS.border}` }}
              className="rounded-2xl p-5 w-full max-w-[420px] font-sans shadow-xl max-h-[85vh] overflow-y-auto"
            >
              <div className="font-display font-semibold text-base mb-1" style={{ color: COLORS.text }}>
                Bulk update selling point
              </div>
              <div style={{ color: COLORS.textMuted }} className="text-xs mb-3 leading-relaxed">
                Satu baris untuk satu selling point, format: <b>Kategori | Selling point | Sales talk</b>.
                Kalau sales talk dikosongkan, otomatis dipakai sama dengan selling point-nya. Contoh:
                <div style={{ background: COLORS.surfaceAlt }} className="rounded-lg p-2 mt-1.5 font-mono text-[11px] leading-relaxed">
                  Kamera | OIS kamera utama | Hasil foto stabil walau tangan goyang.<br />
                  Baterai | Baterai 6000mAh | Tahan seharian penuh, nggak perlu bolak-balik cas.
                </div>
              </div>
              <textarea
                autoFocus
                value={bulkText}
                onChange={(e) => setBulkText(e.target.value)}
                placeholder={"Kategori | Selling point | Sales talk\nKategori | Selling point | Sales talk"}
                style={inputStyle}
                className="w-full px-3 py-2 rounded-lg text-sm outline-none resize-none mb-3"
                rows={7}
              />
              <div className="flex items-center gap-4 mb-4 text-xs">
                <label className="flex items-center gap-1.5 cursor-pointer">
                  <input type="radio" checked={bulkMode === "append"} onChange={() => setBulkMode("append")} />
                  Tambahkan ke yang sudah ada
                </label>
                <label className="flex items-center gap-1.5 cursor-pointer">
                  <input type="radio" checked={bulkMode === "replace"} onChange={() => setBulkMode("replace")} />
                  Ganti semua punya tipe ini
                </label>
              </div>
              <div className="flex gap-2 justify-end">
                <button
                  onClick={() => {
                    setShowBulkModal(false);
                    setBulkText("");
                  }}
                  style={{ color: COLORS.textMuted }}
                  className="text-sm px-3 py-1.5"
                >
                  Batal
                </button>
                <button
                  onClick={saveBulkPoints}
                  style={{ background: `linear-gradient(135deg, ${COLORS.red}, ${COLORS.redSoft})`, color: "#FFFFFF" }}
                  className="text-sm px-4 py-1.5 rounded-lg font-medium shadow-sm"
                >
                  Simpan semua
                </button>
              </div>
            </div>
          </div>
        )}

        {lightboxIndex !== null && modelImages[lightboxIndex] && (
          <div
            style={{ background: "rgba(0,0,0,0.92)" }}
            className="fixed inset-0 flex flex-col items-center justify-center z-50 px-4"
            onClick={() => setLightboxIndex(null)}
          >
            <button onClick={() => setLightboxIndex(null)} className="absolute top-4 right-4 text-white/80 p-2">
              <X size={22} />
            </button>
            {isAdmin && (
              <button
                onClick={(e) => {
                  e.stopPropagation();
                  deleteImage(modelImages[lightboxIndex].id);
                }}
                className="absolute top-4 left-4 text-white/80 p-2"
              >
                <Trash2 size={20} />
              </button>
            )}
            <img
              src={modelImages[lightboxIndex].dataUrl}
              alt="Spesifikasi"
              onClick={(e) => e.stopPropagation()}
              className="max-h-[75vh] max-w-full object-contain rounded-lg"
            />
            {modelImages.length > 1 && (
              <div className="flex items-center gap-6 mt-4" onClick={(e) => e.stopPropagation()}>
                <button
                  onClick={() => setLightboxIndex((lightboxIndex - 1 + modelImages.length) % modelImages.length)}
                  className="text-white/80 p-2"
                >
                  <ChevronLeft size={20} />
                </button>
                <span className="text-white/70 text-xs">{lightboxIndex + 1} / {modelImages.length}</span>
                <button
                  onClick={() => setLightboxIndex((lightboxIndex + 1) % modelImages.length)}
                  className="text-white/80 p-2"
                >
                  <ChevronRight size={20} />
                </button>
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
